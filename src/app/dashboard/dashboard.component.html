<div class="dashboard-container">
    <nz-row [nzGutter]="[16, 16]">
        <nz-col *ngFor="let card of cards" [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="8">
            <!-- The click event now calls the specific action for each card -->
            <nz-card class="action-card" [nzHoverable]="true" (click)="card.action()">
                <div class="card-content">
                    <i nz-icon [nzType]="card.icon" class="card-icon"></i>
                    <h2 class="card-title">{{ card.title }}</h2>
                    <p class="card-description">{{ card.description }}</p>
                </div>
            </nz-card>
        </nz-col>
    </nz-row>
</div>
