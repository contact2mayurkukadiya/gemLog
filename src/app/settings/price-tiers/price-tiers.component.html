<div class="page-container">
    <nz-page-header nzBackIcon nzTitle="Set Diamond Prices"
        nzSubtitle="Define your weight/sieve tiers and their prices"></nz-page-header>

    <div *ngIf="isLoading" class="spinner-container">
        <nz-spin nzSimple></nz-spin>
    </div>

    <form nz-form [formGroup]="priceForm" (ngSubmit)="submitForm()" *ngIf="!isLoading">
        <!-- This div iterates over the FormArray -->
        <div formArrayName="tiers">
            <!-- A header for the columns -->
            <div nz-row [nzGutter]="8" class="form-row form-header">
                <div nz-col nzSpan="10">Weight/Sieve (e.g., 1-20)</div>
                <div nz-col nzSpan="10">Price</div>
                <div nz-col nzSpan="4">Action</div>
            </div>

            <!-- Loop through each tier group -->
            <div *ngFor="let tier of tiers.controls; let i=index" [formGroupName]="i" nz-row [nzGutter]="8"
                class="form-row">
                <!-- Tier Name Input -->
                <nz-form-item nz-col nzSpan="10">
                    <nz-form-control nzErrorTip="Name is required">
                        <input nz-input formControlName="name" placeholder="e.g., 1-20 or 21-40">
                    </nz-form-control>
                </nz-form-item>

                <!-- Tier Price Input -->
                <nz-form-item nz-col nzSpan="10">
                    <nz-form-control nzErrorTip="Valid price is required">
                        <nz-input-number class="w-full" formControlName="price" [nzMin]="0" [nzStep]="0.1"
                            [nzPlaceHolder]="'e.g., 192.7'"></nz-input-number>
                    </nz-form-control>
                </nz-form-item>

                <!-- Remove Button -->
                <nz-form-item nz-col nzSpan="4">
                    <button nz-button nzType="text" nzDanger (click)="removeTier(i)" *ngIf="tiers.length > 1">
                        <i nz-icon nzType="delete"></i>
                    </button>
                </nz-form-item>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="form-actions">
            <button nz-button type="button" nzType="dashed" (click)="addTier()" class="add-button">
                <i nz-icon nzType="plus"></i> Add Tier
            </button>
            <button nz-button nzType="primary" [disabled]="priceForm.invalid">
                <i nz-icon nzType="save"></i> Save Prices
            </button>
        </div>
    </form>
</div>
