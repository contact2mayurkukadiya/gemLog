<div class="page-container" [formGroup]="priceForm">
    <div class="page-header">
        <h1 class="page-title">Manage Price</h1>
        <div class="header-actions">
            <button nz-button nzType="primary" *ngIf="tiers.length > 0" (click)="submitForm()"
                [disabled]="priceForm.invalid">
                <i nz-icon nzType="save"></i> Save
            </button>
            <button nz-button nzType="dashed" (click)="addNewTierRow()">
                <i nz-icon nzType="plus"></i>
            </button>
        </div>
    </div>

    <ng-container *ngIf="tiers.length > 0">
        <div class="table-scroll-container">
            <nz-table #priceTable [nzData]="tiers.controls" [nzFrontPagination]="false" [nzShowPagination]="false"
                nzBordered class="price-table">
                <thead>
                    <tr>
                        <th [nzWidth]="'35%'">Weight</th>
                        <th [nzWidth]="'35%'">Sieve</th>
                        <th [nzWidth]="'30%'">Price</th>
                        <th nzAlign="center">Action</th>
                    </tr>
                </thead>
                <tbody formArrayName="tiers">
                    <tr *ngFor="let tier of tiers.controls; let i = index" [formGroupName]="i">
                        <td>
                            <nz-form-item>
                                <nz-form-control nzErrorTip>
                                    <nz-input-number class="w-full" formControlName="weight" [nzPlaceHolder]="'Weight'"
                                        [nzMin]="0"></nz-input-number>
                                </nz-form-control>
                            </nz-form-item>
                        </td>
                        <td>
                            <nz-form-item>
                                <nz-form-control>
                                    <nz-input-number class="w-full" formControlName="sieve" [nzPlaceHolder]="'Sieve'"
                                        [nzMin]="0"></nz-input-number>
                                </nz-form-control>
                            </nz-form-item>
                        </td>
                        <td>
                            <nz-form-item>
                                <nz-form-control nzErrorTip>
                                    <nz-input-number class="w-full" formControlName="price" [nzPlaceHolder]="'Price'"
                                        [nzMin]="0"></nz-input-number>
                                </nz-form-control>
                            </nz-form-item>
                        </td>
                        <td nzAlign="center">
                            <button nz-button nzType="text" nzDanger (click)="deleteTier(i)">
                                <i nz-icon nzType="delete"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </nz-table>
        </div>
    </ng-container>

    <ng-container *ngIf="tiers.length <= 0">
        <div class="empty-state-container">
            <nz-empty nzNotFoundImage="https://gw.alipayobjects.com/zos/antfincdn/ZHrcdLPrvN/empty.svg"
                [nzNotFoundContent]="'No price tiers created yet.'">
                <button nz-button nzType="primary" (click)="addNewTierRow()">Create First Tier</button>
            </nz-empty>
        </div>
    </ng-container>
</div>
