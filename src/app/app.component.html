<ng-container *ngIf="user$ | async as user; else showLogin">
  <ng-container *ngIf="isMobile() === true; else desktopLayout">
    <nz-layout class="app-layout">
      <nz-header class="app-header">
        <i class="trigger" nz-icon nzType="menu" (click)="drawerVisible = true"></i>
        <span class="app-header-logo-container">
          <img src="assets/images/icon.png" class="header-logo-icon" (click)="drawerVisible = true" />
          <h1 class="app-title"><span class="color-nevyblue">Gem</span><span class="color-skyblue"> Log</span></h1>
        </span>
      </nz-header>
      <nz-content class="app-content">
        <router-outlet></router-outlet>
      </nz-content>
      <app-mobile-action-bar></app-mobile-action-bar>
      <nz-drawer [nzVisible]="drawerVisible" nzPlacement="left" (nzOnClose)="drawerVisible = false"
        [nzTitle]="drawerTitleTemplate" [nzClosable]="false" [nzBodyStyle]="{padding: 0}">
        <ng-container *nzDrawerContent>
          <app-main-menu [theme]="currentTheme" (menuItemClicked)="drawerVisible = false"
            [isMobile]="isMobile()!"></app-main-menu>
        </ng-container>
      </nz-drawer>
    </nz-layout>
  </ng-container>
</ng-container>

<ng-template #desktopLayout>
  <nz-layout class="app-layout">
    <nz-sider [nzTheme]="currentTheme" [nzWidth]="240">
      <div class="logo">
        <span class="app-header-logo-container">
          <img src="assets/images/icon.png" class="header-logo-icon" />
          <h1 class="app-title"><span class="color-nevyblue">Gem</span><span class="color-skyblue"> Log</span></h1>
        </span>
      </div>
      <app-main-menu [theme]="currentTheme" [isMobile]="isMobile()!"></app-main-menu>
    </nz-sider>
    <nz-layout>
      <nz-content class="app-content-desktop">
        <router-outlet></router-outlet>
      </nz-content>
    </nz-layout>
  </nz-layout>
</ng-template>


<ng-template #showLogin>
  <router-outlet></router-outlet>
</ng-template>


<ng-template #drawerTitleTemplate>
  <div class="drawer-title-container">
    <div class="drawer-logo-container">
      <img src="assets/images/icon.png" class="header-logo-icon" (click)="drawerVisible = true" />
      <span>Menu</span>
    </div>
    <button nz-button nzType="text" (click)="drawerVisible = false" class="close-drawer-btn">
      <i nz-icon nzType="close"></i>
    </button>
  </div>
</ng-template>
